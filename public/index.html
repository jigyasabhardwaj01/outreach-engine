<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outreach review</title>
<style>
  :root {
    --bg: #fbfbfa; --card: #fff; --ink: #1a1a19; --soft: #6b6b66; --line: #e4e4e0; --raise: #f3f3f0;
    --ok: #1f7a4d; --no: #a33a2a; --warn: #8a5a00; --warn-bg: #fdf6e7; --accent: #2c5ce6;
    --radius: 11px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a; --card: #1e1e23; --ink: #ececea; --soft: #9a9a94; --line: #32323a; --raise: #26262c;
      --ok: #6cc08b; --no: #e68a78; --warn: #e0b057; --warn-bg: #2b2516; --accent: #8fa8ff;
    }
  }
  * { box-sizing: border-box; }
  /* display:flex on .row and .tabs would otherwise beat the hidden attribute. */
  [hidden] { display: none !important; }

  body {
    margin: 0; padding: 20px 16px 80px; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 19px; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 16px; margin: 0; letter-spacing: -0.01em; }
  p { margin: 8px 0 0; }
  .soft { color: var(--soft); }
  .small { font-size: 13px; }
  .bad { color: var(--no); }

  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .between { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .actions { margin-top: 14px; }
  .fields { margin-top: 10px; }
  .fields input { flex: 1 1 160px; }

  header { margin-bottom: 14px; }
  .masthead { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  #chips { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .status { min-height: 20px; font-size: 13px; color: var(--soft); margin: 8px 0 0; }
  .status.working::after { content: ''; display: inline-block; width: 7px; height: 7px; margin-left: 7px;
    border-radius: 50%; background: var(--accent); animation: pulse 1s ease-in-out infinite; vertical-align: middle; }
  .status.ok { color: var(--ok); }
  .status.bad { color: var(--no); }
  @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .status.working::after { animation: none; } }

  #toolbar { position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 10px 0; border-bottom: 1px solid var(--line); margin-bottom: 14px;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  button {
    font: inherit; padding: 7px 13px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); cursor: pointer; transition: border-color .12s, background .12s;
  }
  button:hover:not(:disabled) { border-color: var(--soft); }
  button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  button.danger { color: var(--no); }
  button.linky { border: 0; background: none; color: var(--accent); padding: 4px 2px; text-decoration: underline; }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .tab { border-radius: 999px; display: inline-flex; gap: 7px; align-items: center; }
  .tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .count { font-size: 12px; opacity: .65; font-variant-numeric: tabular-nums; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .card.tight { padding: 12px 16px; }

  .pill { font-size: 12px; background: var(--raise); border-radius: 999px; padding: 2px 9px; color: var(--soft); white-space: nowrap; }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .verdict { font-weight: 600; }
  .verdict.qualify { color: var(--ok); }
  .verdict.reject { color: var(--no); }
  .note { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 11px; margin: 8px 0 0; }

  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
  th, td { text-align: left; padding: 8px; border-top: 1px solid var(--line); vertical-align: top; }
  th { color: var(--soft); font-weight: 500; }
  blockquote { margin: 0 0 3px; color: var(--soft); font-style: italic; }
  a { color: var(--accent); }

  input[type=text], input[type=password], textarea {
    font: inherit; width: 100%; padding: 9px 11px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  textarea { min-height: 160px; resize: vertical; line-height: 1.6; }
  label { display: block; margin: 12px 0 5px; font-size: 13px; color: var(--soft); }

  details > summary { cursor: pointer; color: var(--soft); font-size: 13px; margin-top: 10px; }
  .empty { color: var(--soft); padding: 40px 16px; text-align: center; }

  dialog { border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); color: var(--ink);
    padding: 20px; max-width: 420px; width: calc(100% - 32px); }
  dialog::backdrop { background: rgba(0, 0, 0, .45); }

  @media (max-width: 560px) {
    .between { flex-direction: column; align-items: flex-start; gap: 4px; }
    .actions button { flex: 1 1 auto; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="masthead">
      <h1>Outreach review</h1>
      <div id="chips"></div>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </header>

  <div id="toolbar"></div>
  <div class="tabs" role="tablist" aria-label="Review stages"></div>
  <div id="list"></div>
</main>

<dialog id="signin" aria-label="Sign in"></dialog>
<script type="module" src="/app.js"></script>
</body>
</html>
