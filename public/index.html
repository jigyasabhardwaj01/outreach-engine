<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outreach review</title>
<meta name="description" content="Evidence-first cold outreach: companies qualified against a profile, every answer with its source, nothing sent without approval.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e8701a'/%3E%3Cpath d='M7 11h18v11H7z' fill='none' stroke='%23fff' stroke-width='2.2'/%3E%3Cpath d='M7 12l9 6 9-6' fill='none' stroke='%23fff' stroke-width='2.2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f5f2; --card: #fff; --ink: #292226; --soft: #6d6269; --line: #e6e2dc; --raise: #efece6;
    --amber: #e8701a; --plum-1: #3d0627; --plum-2: #650a41;
    --ok: #1f7a4d; --no: #a33a2a; --warn: #8a5a00; --warn-bg: #fdf4e6;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(41, 34, 38, .05), 0 8px 24px -16px rgba(41, 34, 38, .25);
    /* Kivo's depth: a card that floats rather than one that sits. */
    --lift: 0 1px 2px rgba(41, 34, 38, .04), 0 18px 40px -24px rgba(41, 34, 38, .32);
    --glass: rgba(255, 255, 255, .72);
    --ease: cubic-bezier(.22, .61, .36, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #17141a; --card: #1f1b22; --ink: #efe9ec; --soft: #a0939b; --line: #322b36; --raise: #272030;
      --amber: #f0893d; --plum-1: #2d0a22; --plum-2: #591038;
      --ok: #6cc08b; --no: #e68a78; --warn: #e0b057; --warn-bg: #2c2415;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px -20px rgba(0, 0, 0, .8);
      --lift: 0 1px 2px rgba(0, 0, 0, .45), 0 22px 48px -28px rgba(0, 0, 0, .9);
      --glass: rgba(31, 27, 34, .66);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 15px/1.6 "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 900px; margin: 0 auto; padding: 0 20px 90px; }

  /* ---------- masthead ---------- */
  .masthead {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--paper) 78%, transparent);
    backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4);
    border-bottom: 1px solid var(--line); margin-bottom: 36px;
  }
  /* Backdrop filters are not everywhere; without one the bar must still be
     opaque enough to read the page through it. */
  @supports not (backdrop-filter: blur(1px)) {
    .masthead { background: var(--paper); }
  }
  .masthead-inner {
    max-width: 900px; margin: 0 auto; padding: 13px 20px;
    display: flex; align-items: center; gap: 14px;
  }
  .wordmark { font-weight: 700; letter-spacing: -.02em; font-size: 17px; }
  .wordmark span { color: var(--amber); }
  .divider { width: 1px; height: 17px; background: var(--line); }
  .masthead .here { color: var(--soft); font-size: 14px; }
  .masthead #chips { margin-left: auto; display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }

  /* ---------- the hero scene ----------
     An ambient wash, a field of dots and the orb, layered behind the words.
     All three are decoration: none of them takes pointer events, and none is
     announced to a screen reader. */
  .scene { position: relative; isolation: isolate; }
  .scene > .glow, .scene > .field {
    /* Flush with the hero, not bleeding past it. A decorative layer wider
       than its container is a horizontal scrollbar on narrow screens, and
       these gradients fade to nothing well before the edge, so the bleed
       bought no softness it did not already have. */
    position: absolute; inset: -40px 0 auto; height: 420px;
    pointer-events: none; z-index: -1;
  }
  .glow {
    background:
      radial-gradient(ellipse 60% 48% at 50% 0%, color-mix(in srgb, var(--amber) 15%, transparent), transparent 70%),
      radial-gradient(ellipse 42% 40% at 78% 24%, color-mix(in srgb, var(--plum-2) 11%, transparent), transparent 72%);
  }
  .field { opacity: .85; animation: drift 42s var(--ease) infinite; }
  @keyframes drift {
    0%, 100% { transform: translate3d(0, 0, 0); }
    50% { transform: translate3d(0, 9px, 0); }
  }

  /* ---------- the orb ----------
     Turning means requests are in flight. It is driven by what the page is
     really doing, so a still orb is information too. */
  .orbwrap { position: relative; width: 112px; height: 112px; margin: 2px auto 14px; }
  .orb { width: 100%; height: 100%; display: block; }
  .ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 1px dashed color-mix(in srgb, var(--soft) 34%, transparent);
    transition: border-color .7s var(--ease), opacity .7s var(--ease);
  }
  .ring.two { inset: -13px; opacity: .55; }
  .ring.three { inset: -26px; opacity: .3; }
  .orbwrap.live .ring { border-color: color-mix(in srgb, var(--amber) 52%, transparent); }
  /* Only the rings turn when something is running; they are the cheapest
     possible way to say "moving" and they cost one composited layer. */
  .orbwrap.live .ring { animation: orbit 15s linear infinite; }
  .orbwrap.live .ring.two { animation-duration: 23s; animation-direction: reverse; }
  .orbwrap.live .ring.three { animation-duration: 34s; }
  @keyframes orbit { to { transform: rotate(360deg); } }
  /* Kivo draws arc segments around its sphere. Here the arc is how much of
     the shortlist is finished — a real fraction, set from JavaScript as a
     --through property between 0 and 1. */
  .arc { position: absolute; inset: -6px; transform: rotate(-90deg); pointer-events: none; }
  .arc circle {
    fill: none; stroke-width: 1.6; cx: 50%; cy: 50%; r: 48%;
    stroke-dasharray: var(--circumference, 302);
    stroke-dashoffset: calc(var(--circumference, 302) * (1 - var(--through, 0)));
    stroke: var(--amber); stroke-linecap: round;
    transition: stroke-dashoffset .9s var(--ease);
  }

  .orblabel {
    font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--soft); min-height: 15px; transition: color .5s var(--ease);
  }
  .orbwrap.live + .orblabel { color: var(--amber); }

  /* ---------- hero ---------- */
  .hero { text-align: center; padding: 26px 0 30px; }
  .hero h1 {
    margin: 0 auto; max-width: 15ch;
    font-size: clamp(30px, 6vw, 52px); font-weight: 700; line-height: 1.08; letter-spacing: -.028em;
  }
  .hero h1 em { font-style: normal; color: var(--amber); }
  /* Each word rides up from behind its own clipped line. The mask is what
     makes it read as typesetting rather than as things sliding about. */
  .hero h1 .mask { display: inline-block; overflow: hidden; vertical-align: bottom; }
  .hero h1 .mask > span {
    display: inline-block; transform: translateY(105%);
    transition: transform .62s var(--ease);
  }
  .hero h1.typed .mask > span { transform: none; }
  .hero p { max-width: 54ch; margin: 16px auto 0; color: var(--soft); }

  /* ---------- pipeline rail ----------
     Kivo draws its architecture as nodes joined by lines with work moving
     along them. The same picture fits here exactly, because this genuinely
     is a pipeline — so an edge only carries a pulse when a company has
     actually reached the far side of it. */
  .rail {
    display: flex; justify-content: center; gap: 0; margin: 30px auto 0; max-width: 680px;
    /* Where the dot's centre lands: the step counter's height plus its gap,
       plus half the dot. Everything that has to line up with the dot reads
       this instead of carrying its own copy of the arithmetic. */
    --step-h: 18px;
    --wire: calc(var(--step-h) + 6px);
  }
  .stop { flex: 1; text-align: center; position: relative; }
  .stop::before {
    content: ''; position: absolute; top: var(--wire); left: -50%; width: 100%; height: 1.5px;
    background: var(--line); transition: background .6s var(--ease);
  }
  .stop:first-child::before { display: none; }
  .stop.done::before { background: color-mix(in srgb, var(--amber) 55%, var(--line)); }

  /* The pulse: a short bright run of the edge, travelling from one node to
     the next. One composited gradient, no JavaScript per frame. */
  .stop.flowing::after {
    content: ''; position: absolute; top: calc(var(--wire) - .8px); left: -50%; width: 100%; height: 2.4px;
    border-radius: 2px; background: linear-gradient(90deg, transparent, var(--amber), transparent);
    background-size: 42% 100%; background-repeat: no-repeat;
    animation: carry 2.4s var(--ease) infinite;
  }
  @keyframes carry {
    0% { background-position: -45% 0; opacity: 0; }
    12% { opacity: .95; }
    78% { opacity: .95; }
    100% { background-position: 125% 0; opacity: 0; }
  }

  .dot {
    width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--line);
    background: var(--paper); margin: 0 auto 9px; position: relative; z-index: 1;
    transition: border-color .5s var(--ease), background .5s var(--ease), box-shadow .5s var(--ease);
  }
  .stop.done .dot { border-color: var(--amber); }
  .stop.here .dot { background: var(--amber); border-color: var(--amber); box-shadow: 0 0 0 4px color-mix(in srgb, var(--amber) 22%, transparent); }
  /* The breathing ring on the node where the work currently is. */
  .stop.here .dot::after {
    content: ''; position: absolute; inset: -2px; border-radius: 50%;
    border: 1.5px solid var(--amber); animation: breathe 2.6s var(--ease) infinite;
  }
  @keyframes breathe {
    0% { transform: scale(1); opacity: .7; }
    70%, 100% { transform: scale(2.4); opacity: 0; }
  }
  .stop .step {
    font-size: 9px; letter-spacing: .1em; color: var(--soft); opacity: .5;
    font-variant-numeric: tabular-nums; height: var(--step-h); line-height: var(--step-h);
    white-space: nowrap;
  }
  .stop .name { font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--soft); }
  .stop.done .name, .stop.here .name { color: var(--ink); }
  .stop .n { font-size: 11px; color: var(--soft); font-variant-numeric: tabular-nums; }

  /* ---------- action cards ---------- */
  .doing { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 34px; }
  .do {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px;
  }
  .do {
    transition: box-shadow .4s var(--ease), border-color .4s var(--ease), transform .4s var(--ease);
    transform-style: preserve-3d; will-change: transform;
  }
  .do:hover { box-shadow: var(--lift); border-color: color-mix(in srgb, var(--amber) 28%, var(--line)); }
  .do .icon {
    width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
    background: var(--amber); color: #fff; margin-bottom: 4px;
    animation: hover-float 6s var(--ease) infinite;
  }
  @keyframes hover-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3.5px); }
  }
  .do .icon.plum { background: linear-gradient(135deg, var(--plum-1), var(--plum-2)); }
  .do h3 { margin: 0; font-size: 16.5px; font-weight: 600; letter-spacing: -.012em; }
  .do p { margin: 0; color: var(--soft); font-size: 13.5px; }
  .do .go { margin-top: auto; padding-top: 12px; }

  /* ---------- banner ---------- */
  .banner {
    margin-top: 26px; border-radius: var(--radius); padding: 18px 22px; color: #fff;
    background: linear-gradient(100deg, var(--plum-1), var(--plum-2));
  }
  .banner strong { display: block; font-size: 17px; font-weight: 600; letter-spacing: -.012em; }
  .banner span { font-size: 13px; opacity: .72; }

  /* ---------- measurement strip ---------- */
  .metrics { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .stat {
    flex: 1 1 120px; background: var(--card); border: 1px solid var(--line); border-radius: 11px;
    padding: 12px 14px; display: flex; flex-direction: column; gap: 2px;
  }
  .stat .figure { font-size: 19px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .stat .label { font-size: 11.5px; color: var(--soft); }

  /* ---------- tabs ---------- */
  .tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin: 30px 0 6px; overflow-x: auto; }
  .tab {
    border: 0; background: none; color: var(--soft); font: inherit; font-weight: 500; cursor: pointer;
    padding: 10px 0 11px; border-bottom: 2px solid transparent; white-space: nowrap;
    display: inline-flex; gap: 7px; align-items: center;
  }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--amber); }
  .count {
    font-size: 11.5px; background: var(--raise); border-radius: 999px; padding: 1px 7px;
    color: var(--soft); font-variant-numeric: tabular-nums;
  }
  .tab[aria-selected="true"] .count { background: color-mix(in srgb, var(--amber) 16%, transparent); color: var(--amber); }
  .blurb { color: var(--soft); font-size: 13px; margin: 10px 0 18px; }

  /* ---------- cards ---------- */
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 20px; margin-bottom: 14px; box-shadow: var(--shadow);
    transition: box-shadow .4s var(--ease), border-color .4s var(--ease), transform .4s var(--ease);
    transform-style: preserve-3d; will-change: transform;
  }
  .card:hover { box-shadow: var(--lift); border-color: color-mix(in srgb, var(--amber) 26%, var(--line)); }

  /* Cards arrive rather than appear. Staggered in motion.js, so a list of
     six reads top to bottom instead of all at once. */
  .reveal { opacity: 0; transform: translateY(10px); transition: opacity .5s var(--ease), transform .5s var(--ease); }
  .reveal.shown { opacity: 1; transform: none; }

  /* How far through its questions a company is: a real fraction of the
     profile's qualifiers, not a bar that creeps towards the end. */
  .bar { height: 3px; border-radius: 3px; background: var(--raise); overflow: hidden; margin-top: 9px; }
  .bar > i { display: block; height: 100%; border-radius: 3px; background: var(--amber); transition: width .7s var(--ease); }

  /* A frosted panel, used where something floats over the page. */
  .glass {
    background: var(--glass); backdrop-filter: blur(14px) saturate(1.3);
    -webkit-backdrop-filter: blur(14px) saturate(1.3);
    border: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
  }

  /* Swapping tabs: a short cross-fade, the way Kivo moves between pages. */
  #list { transition: opacity .11s var(--ease), transform .11s var(--ease); }
  #list.leaving { opacity: 0; transform: translateY(4px); }
  #list.entering { opacity: 0; transform: translateY(-4px); transition: none; }
  .card.tight { padding: 14px 20px; }
  .between { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .actions { margin-top: 16px; }
  .fields { margin-top: 12px; }
  .fields input { flex: 1 1 150px; }

  h1, h2, h3 { letter-spacing: -.015em; }
  h2 { font-size: 17px; margin: 0; font-weight: 600; }
  p { margin: 9px 0 0; }
  .soft { color: var(--soft); }
  .small { font-size: 13px; }
  .bad { color: var(--no); }

  button {
    font: inherit; font-weight: 500; padding: 8px 15px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); cursor: pointer;
    transition: border-color .2s var(--ease), background .2s var(--ease), opacity .2s var(--ease), transform .28s var(--ease), box-shadow .28s var(--ease);
  }
  button.primary:hover:not(:disabled) { box-shadow: 0 6px 18px -8px color-mix(in srgb, var(--ink) 55%, transparent); }
  button:hover:not(:disabled) { border-color: var(--soft); }
  button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible, .tab:focus-visible, #list:focus-visible {
    outline: 2px solid var(--amber); outline-offset: 2px;
  }
  button:disabled { opacity: .42; cursor: not-allowed; }
  button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  button.danger { color: var(--no); }
  button.linky, button.go-link {
    border: 0; background: none; padding: 0; color: var(--amber); font-weight: 600; font-size: 13.5px;
  }
  button.linky { color: var(--soft); font-weight: 500; text-decoration: underline; }
  button.go-link:disabled { opacity: .45; }

  .pill { font-size: 12px; background: var(--raise); border-radius: 999px; padding: 2px 10px; color: var(--soft); white-space: nowrap; }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.bad { background: color-mix(in srgb, var(--no) 14%, transparent); color: var(--no); }
  .pill.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
  .pill.live::before {
    content: ''; display: inline-block; width: 5px; height: 5px; border-radius: 50%;
    background: currentColor; margin-right: 6px; vertical-align: 1px;
    animation: blink 2.2s var(--ease) infinite;
  }
  @keyframes blink { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  .verdict { font-weight: 600; }
  .verdict.qualify { color: var(--ok); }
  .verdict.reject { color: var(--no); }
  .note { background: var(--warn-bg); color: var(--warn); border-radius: 9px; padding: 9px 12px; margin: 9px 0 0; font-size: 13px; }

  .status { min-height: 19px; font-size: 13px; color: var(--soft); margin: 10px 0 0; text-align: center; }
  .status.working::after {
    content: ''; display: inline-block; width: 7px; height: 7px; margin-left: 7px;
    border-radius: 50%; background: var(--amber); animation: pulse 1s ease-in-out infinite; vertical-align: middle;
  }
  .status.ok { color: var(--ok); }
  .status.bad { color: var(--no); }
  /* No height of its own: it is empty except while something is running,
     and a permanently reserved strip is a permanent hole in the page. */
  .stopline { text-align: center; }
  .stopline button { font-size: 13px; }
  .stopline:empty { display: none; }
  @keyframes pulse { 0%, 100% { opacity: .22; } 50% { opacity: 1; } }
  /* Asked for less movement: everything stops. The orb still renders — it
     is a picture of the system's state, and a still picture is fine — but
     nothing drifts, pulses, breathes, floats, tilts or fades. The page is
     fully usable with every animation here switched off, which is the test
     that says whether the motion was decoration or load-bearing. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important; animation-iteration-count: 1 !important;
      transition-duration: .001ms !important; scroll-behavior: auto !important;
    }
    .field, .glow { display: none; }
    .reveal { opacity: 1; transform: none; }
  }

  /* ---------- the evidence graph ----------
     Kivo's hub picture, doing a real job: every question that got an answer,
     feeding the verdict it produced. The node that actually decided it is
     the one drawn solid. */
  .graph { margin-top: 15px; position: relative; }
  .graph svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .graph .wires path { fill: none; stroke: var(--line); stroke-width: 1.2; }
  .graph .wires path.decided { stroke: color-mix(in srgb, var(--amber) 70%, transparent); stroke-width: 1.6; }
  .graph .chips { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; position: relative; }
  .node {
    font-size: 12px; border-radius: 999px; padding: 4px 11px; white-space: nowrap;
    border: 1px solid var(--line); background: var(--paper); color: var(--soft);
    transition: border-color .4s var(--ease), color .4s var(--ease), background .4s var(--ease);
  }
  .node.decided { border-color: var(--amber); color: var(--amber); background: color-mix(in srgb, var(--amber) 8%, transparent); }
  .node.unsourced { border-style: dashed; opacity: .7; }
  .node b { font-weight: 600; color: var(--ink); }
  .node.decided b { color: var(--amber); }
  .hub {
    margin: 30px auto 0; width: max-content; max-width: 100%; text-align: center;
    border-radius: 12px; padding: 9px 15px; border: 1px solid var(--line); background: var(--card);
    position: relative; box-shadow: var(--shadow);
  }
  .hub .kind { font-size: 12.5px; font-weight: 600; }
  .hub.qualify .kind { color: var(--ok); }
  .hub.reject .kind { color: var(--no); }
  .hub .why { font-size: 12px; color: var(--soft); }

  /* A light that follows the pointer, which is how Kivo does its interactive
     glow: one radial gradient, positioned from two custom properties. */
  .card { --mx: 50%; --my: 0px; }
  .card::before {
    content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    opacity: 0; transition: opacity .35s var(--ease);
    background: radial-gradient(260px circle at var(--mx) var(--my), color-mix(in srgb, var(--amber) 10%, transparent), transparent 70%);
  }
  .card { position: relative; }
  .card.lit::before { opacity: 1; }
  .card > * { position: relative; }

  table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 13px; }
  th, td { text-align: left; padding: 9px 8px; border-top: 1px solid var(--line); vertical-align: top; }
  th { color: var(--soft); font-weight: 500; }
  blockquote { margin: 0 0 3px; color: var(--soft); font-style: italic; }
  a { color: var(--amber); }

  input[type=text], input[type=password], textarea {
    font: inherit; width: 100%; padding: 10px 12px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink);
  }
  textarea { min-height: 165px; resize: vertical; line-height: 1.65; }
  label { display: block; margin: 14px 0 5px; font-size: 13px; color: var(--soft); }

  details > summary { cursor: pointer; color: var(--soft); font-size: 13px; margin-top: 12px; }
  .empty { color: var(--soft); padding: 44px 16px; text-align: center; }

  dialog {
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); color: var(--ink);
    padding: 24px; max-width: 420px; width: calc(100% - 32px); box-shadow: var(--shadow);
  }
  dialog::backdrop { background: rgba(41, 34, 38, .5); }

  @media (max-width: 620px) {
    .doing { grid-template-columns: 1fr; }

    /* Four stacked chips turned a sticky header into a fifth of the screen,
       on every screen, forever. One scrollable line instead: the same
       information, one line tall. */
    .masthead-inner { padding: 10px 16px; flex-wrap: wrap; row-gap: 7px; }
    .masthead #chips {
      margin-left: 0; order: 2; flex-basis: 100%;
      flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
      padding-bottom: 1px; gap: 6px;
    }
    .masthead #chips::-webkit-scrollbar { display: none; }
    .masthead .here, .divider { display: none; }
    .pill { font-size: 11.5px; padding: 2px 9px; }

    .hero { padding: 16px 0 22px; }
    main { padding: 0 16px 70px; }
    .rail { max-width: none; --step-h: 0px; --wire: 6px; }
    .stop .step { display: none; }
    .orbwrap { width: 88px; height: 88px; }
    /* Stacked chips make the converging lines meaningless, so they go. */
    .graph svg.wires { display: none; }
    .hub { margin-top: 14px; }
    /* Six labels will not fit across a phone, so show only where things are. */
    .stop .name { display: none; }
    .stop.here .name { display: block; font-size: 10px; letter-spacing: .06em; white-space: nowrap; }
    .between { flex-direction: column; align-items: flex-start; gap: 5px; }
  }
</style>
</head>
<body>
<header class="masthead">
  <div class="masthead-inner">
    <span class="wordmark">Outreach<span>.</span></span>
    <span class="divider"></span>
    <span class="here">Review</span>
    <div id="chips"></div>
  </div>
</header>

<main>
  <section class="hero scene">
    <div class="glow" aria-hidden="true"></div>
    <canvas class="field" id="field" aria-hidden="true"></canvas>
    <h1>Reach the right teams <em>with a real reason to talk.</em></h1>
    <p>Every company is checked against your profile. Each answer comes with its source, and nothing sends until you approve it.</p>
    <div class="orbwrap" id="orbwrap" aria-hidden="true">
      <span class="ring"></span><span class="ring two"></span><span class="ring three"></span>
      <svg class="arc" id="arc" viewBox="0 0 100 100"><circle></circle></svg>
      <canvas class="orb" id="orb"></canvas>
    </div>
    <p class="orblabel" id="orblabel" aria-hidden="true"></p>
    <div class="rail" id="rail" role="group" aria-label="Pipeline progress"></div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div class="stopline" id="stop"></div>
  </section>

  <section class="doing" id="toolbar"></section>
  <section class="banner" id="banner"></section>
  <section class="metrics" id="metrics"></section>

  <div class="tabs" role="tablist" aria-label="Review stages"></div>
  <p class="blurb" id="blurb"></p>
  <div id="list" role="tabpanel" tabindex="0"></div>
</main>

<dialog id="signin" aria-label="Sign in"></dialog>
<script type="module" src="/app.js"></script>
</body>
</html>
